[Network]
api_ip=https://0451.space
api_port=443
ws_port=8080

[Station]
TerminalId=PC-1
Zone=Bootcamp

[StationList]
AvailableZones=Single, Duo, Trio, Quatro, Bootcamp

[Security]
production=false

[Storage]
data_root=D:/ShellData
volume_label=GAMES
ready_timeout_sec=90

[Paths]
steam=D:/Steam
games=D:/Games
epic=
ea=
riot=

[Diskless]
server_ip=192.168.20.10
client_exe=
# Admin Password CCBoot (General Options на .10). Нужен для Super Client из админки.
# Не коммить боевой пароль. Пусто = только ручной ввод в setup.
admin_password=

[Voice]
enabled=true
hotkey=Grave
hold_ms=250
# Не дакаем во время записи: на Realtek combo это глушит микрофон, STT получает тишину.
duck_percent=20
min_clip_ms=400
lobby_enabled=true
lobby_volume=0.45
lobby_fade_ms=1400

[Replay]
enabled=true
hotkey=F8
seconds=60
save_on_logout=true
vertical=true
auto_on_kill=true
kill_seconds=12
kill_cooldown_sec=75
# Логотип плашки Reels: D:/ShellData/branding/logo.png
# NVENC через ffmpeg на D: (не C:). Пусто = D:/Tools/ffmpeg.exe или PATH.
ffmpeg=D:/Tools/ffmpeg.exe

[Club]
name=0451 KOSINO

[BearingProbe]
enabled=true
night_start=1
night_end=6
hold_ms=4000
high_ratio=0.22
peak_prominence=4.5
min_rms=180

[Integrity]
enabled=true
# UNC эталона на бездиске (.10) или manifest.json внутри
template_root=
tool=robocopy
max_files=64
max_resync_files=12

[Rollback]
enabled=true

[GpuPower]
enabled=true
idle_watts=45
idle_limit_w=45
default_limit_w=0
nvidia_smi=nvidia-smi

[LinkFlap]
enabled=true
poll_ms=15000
cooldown_ms=45000

[HardwareHealth]
enabled=true
# Фантомный дабл-клик: два DOWN одной кнопки быстрее bounce_gap_ms.
# Тикет, если таких вспышек bounce_hits за window, растянутых на spread
# (чтобы не ловить баттерфляй/джиттер за пару секунд).
bounce_gap_ms=40
bounce_hits=10
bounce_window_ms=60000
bounce_spread_ms=15000
chatter_gap_ms=35
chatter_hits=8
# Залипание не-WASD/модификаторов: клавиша down + другие нажатия.
stuck_down_ms=12000
stuck_other_presses=4
cooldown_ms=600000

[RageSmash]
enabled=true
# 10+ разных клавиш за 100 мс — key-mash (нужно падение K/D по GSI).
mash_keys=10
mash_window_ms=100
# Рывок курсора как прокси удара, если у мыши нет IMU.
mouse_shock_px=9000
mouse_shock_ms=80
# Скачок HID-акселерометра/гироскопа относительно базовой линии.
imu_spike=2.4
death_need=2
kd_window_ms=45000
cooldown_ms=180000

[OpenRGB]
# ARGB кулеры через локальный OpenRGB.exe --server. false = поток не стартует.
enabled=false
host=127.0.0.1
port=6742
device_filter=ASRock
# -1 = зона с ADDR / Addressable / ARGB. 0 и выше — жёсткий индекс зоны.
zone_index=-1
max_fps=20
connect_retry_sec=3
# Если в OpenRGB у зоны 0 диодов: разово выставить это число. 0 = не трогать.
led_count=0

[PatchCache]
enabled=true
port=8745
max_files=400
max_file_mb=512
# Ночной WAN-ingest на выбранном fallback-сиде (если Super Client выключен).
ingest=true
night_start=1
night_end=6
# Пусто = D:/Tools/steamcmd.exe или рядом со Steam.
steamcmd=
