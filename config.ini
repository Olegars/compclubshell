[Network]
api_ip=https://0451.space
api_port=443
ws_port=8080

[Station]
TerminalId=PC-1
Zone=Bootcamp

[StationList]
AvailableZones=Single, Duo, Trio, Quatro, Bootcamp

[Security]
; true на клубном образе: киоск вместо explorer. Super Client при загрузке киоск снимает.
; false = отладка: idle/logout не выключают Windows (форма входа остаётся).
production=false

[Storage]
; Persistent SSD (не C: writeback). Логи, оверлеи, machine-cache лаунчеров.
data_root=D:/ShellData
; Если data_root нет — ищем том с этой меткой и пишем <буква>:\ShellData
volume_label=GAMES
ready_timeout_sec=90

[Paths]
; Явные пути на SSD. Каталог игр в админке (exe_path) должен совпадать.
steam=D:/Steam
games=D:/Games
epic=
ea=
riot=

[Diskless]
; Сервер бездиска (VLAN 20). Super Client включает CCBoot Client на этом ПК.
server_ip=192.168.20.10
; Пусто = автопоиск C:\CCBootClient\CCBootClient.exe
client_exe=

[Voice]
enabled=true
hotkey=Grave
hold_ms=250
duck_percent=20
min_clip_ms=400
lobby_enabled=true
lobby_volume=0.45
lobby_fade_ms=1400
; Optional custom track (mp3/wav). If empty — ambient wav is auto-generated.
; lobby_music=C:/ShellVideo/lobby.mp3
; Optional club speakers override (preferred over auto-detect):
; lobby_speakers_id={0.0.0.00000000}....
; lobby_speakers_name=Realtek